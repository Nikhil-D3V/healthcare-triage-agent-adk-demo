# Reference configuration only -- apply via `gcloud model-armor templates
# create` / Agent Gateway console or Terraform, not by "running" this file.

model_armor_template:
  template_id: healthcare-triage-sdp-template
  filters:
    sdp:                     # Sensitive Data Protection
      basic_config:
        filter_enforcement: ENABLED
      info_types:
        - US_SOCIAL_SECURITY_NUMBER
        - DATE_OF_BIRTH
        - PERSON_NAME          # optional - decide per demo whether to redact names
      custom_regex_detectors:
        - name: mrn_pattern
          regex: "MRN-[0-9]{5}"
          redact_as: "[REDACTED_MRN]"
    prompt_injection_and_jailbreak:
      filter_enforcement: ENABLED
      confidence_threshold: MEDIUM_AND_ABOVE
    malicious_uri:
      filter_enforcement: ENABLED

agent_gateway_route:
  route_id: clinical-triage-route
  backend: AGENT_RUNTIME_RESOURCE_NAME   # fill in after deployment.py runs
  ingress_model_armor_template: healthcare-triage-sdp-template
  egress_model_armor_template: healthcare-triage-sdp-template
  authorization_policy:
    # Agent Gateway governs endpoint/IAP-level access. It cannot see or
    # authorize in-process Python function calls inside a Reasoning Engine
    # container. Tool-name ACLs belong on separately registered external MCP
    # servers/APIs, not on this Agent Runtime route.
    identity_binding: clinical-intake-demo-identity   # IAP/IAM identity, NOT a key file

# Sandbox authorization status (verified 2026-09): creating a Unified Access
# Policy was denied by the constraints/iam.managed.disableAccessPolicyBinding
# organization policy. Access Authorization is therefore AUDIT_ONLY, not
# Enforce, until that organization-policy constraint is changed or excepted.

# Known limitation to rehearse around (see docs, verified 2026-09):
# Model Armor's streaming sanitization for ADK agents is scoped specifically
# to the reasoningEngines.streamQuery method for agents running on Agent
# Runtime. Verify which call path this deployment's route actually uses
# before relying on streaming sanitization live.
